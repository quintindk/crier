[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crier"
version = "0.1.0"
description = "Cross-platform embedded LLM inference for the Chamberlain architecture, accelerated by NPUs via ONNX Runtime GenAI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quintin De Kok" }]
keywords = ["llm", "npu", "onnxruntime", "inference", "chamberlain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface-hub>=0.24",
    "typing-extensions>=4.7;python_version<'3.12'",
]

[project.optional-dependencies]
cpu = ["onnxruntime-genai>=0.5"]
directml = ["onnxruntime-genai-directml>=0.5"]
cuda = ["onnxruntime-genai-cuda>=0.5"]
ryzenai = ["onnxruntime-genai>=0.5"]
openvino = ["onnxruntime-genai>=0.5", "openvino>=2024.4"]
qnn = ["onnxruntime-genai>=0.5"]
coreml = ["onnxruntime-genai>=0.5"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
crier = "crier.cli:main"

[project.urls]
Homepage = "https://github.com/quintindk/chamberlain"
Repository = "https://github.com/quintindk/chamberlain"
Issues = "https://github.com/quintindk/chamberlain/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/crier"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: tests that load a real model and require ORT GenAI + hardware (gated by CRIER_RUN_INTEGRATION=1)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/crier"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]
