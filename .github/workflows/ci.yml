name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests (downloads a real model)"
        required: false
        default: "false"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: crier
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        working-directory: crier
        run: ruff check src tests

  test:
    name: unit (${{ matrix.os }} / py${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        working-directory: crier
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest (mocked, no model download)
        working-directory: crier
        env:
          # Belt-and-braces: ensure no test accidentally tries to download.
          HF_HUB_OFFLINE: "1"
        run: pytest -ra --cov=crier --cov-report=term-missing

  integration:
    name: integration (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with CPU EP
        working-directory: crier
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cpu]"
      - name: Pytest integration
        working-directory: crier
        env:
          CRIER_RUN_INTEGRATION: "1"
        run: pytest -ra -m integration tests/integration
